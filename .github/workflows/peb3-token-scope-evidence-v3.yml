name: PEB-3 Token Scope Evidence V3

on:
  pull_request:
    branches: [main]
    paths:
      - .pie-calibration/token-scope-v3-trigger.txt
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  prove-token-scope-v3:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'gycha0109-beep')
    runs-on: ubuntu-latest
    env:
      EXPECTED_OWNER: pie-peb3-lab
      EXPECTED_REPOSITORY: pie-peb3-calibration
      EXPECTED_FULL_NAME: pie-peb3-lab/pie-peb3-calibration
      PEB3_APP_ID: ${{ vars.PEB3_APP_ID }}
      PEB3_APP_PRIVATE_KEY: ${{ secrets.PEB3_APP_PRIVATE_KEY }}
    steps:
      - name: Mint and verify fresh downscoped token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PEB3_APP_ID"
          test -n "$PEB3_APP_PRIVATE_KEY"
          key_file="$(mktemp)"
          app_json="$(mktemp)"
          installs_json="$(mktemp)"
          token_json="$(mktemp)"
          readback_json="$(mktemp)"
          request_json="$(mktemp)"
          trap 'rm -f "$key_file" "$app_json" "$installs_json" "$token_json" "$readback_json" "$request_json"' EXIT
          printf '%s' "$PEB3_APP_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          openssl pkey -in "$key_file" -noout >/dev/null
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          iat="$((now - 60))"
          exp="$((now + 540))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(jq -nc --argjson iat "$iat" --argjson exp "$exp" --arg iss "$PEB3_APP_ID" '{iat:$iat,exp:$exp,iss:$iss}' | b64url)"
          unsigned="$header.$payload"
          signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key_file" | b64url)"
          app_jwt="$unsigned.$signature"
          echo "::add-mask::$app_jwt"
          curl --fail-with-body -sS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $app_jwt" -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/app > "$app_json"
          curl --fail-with-body -sS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $app_jwt" -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/app/installations > "$installs_json"
          installation_count="$(jq --arg owner "$EXPECTED_OWNER" '[.[] | select(.account.login == $owner)] | length' "$installs_json")"
          test "$installation_count" = "1"
          installation_id="$(jq -r --arg owner "$EXPECTED_OWNER" '.[] | select(.account.login == $owner) | .id' "$installs_json")"
          repository_selection="$(jq -r --arg owner "$EXPECTED_OWNER" '.[] | select(.account.login == $owner) | .repository_selection' "$installs_json")"
          test "$repository_selection" = "selected"
          jq -nc --arg repo "$EXPECTED_REPOSITORY" '{repositories:[$repo],permissions:{contents:"write",pull_requests:"write"}}' > "$request_json"
          curl --fail-with-body -sS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $app_jwt" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/app/installations/$installation_id/access_tokens" --data-binary "@$request_json" > "$token_json"
          token="$(jq -r '.token // empty' "$token_json")"
          test -n "$token"
          echo "::add-mask::$token"
          test "$(jq -c '[.repositories[].full_name] | sort' "$token_json")" = "[\"$EXPECTED_FULL_NAME\"]"
          test "$(jq -r '.permissions.contents // empty' "$token_json")" = "write"
          test "$(jq -r '.permissions.pull_requests // empty' "$token_json")" = "write"
          test "$(jq -r '.permissions.metadata // "read"' "$token_json")" = "read"
          test "$(jq -c '[.permissions | to_entries[] | select(.key != "contents" and .key != "pull_requests" and .key != "metadata")]' "$token_json")" = "[]"
          test -n "$(jq -r '.expires_at // empty' "$token_json")"
          curl --fail-with-body -sS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $token" -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/installation/repositories > "$readback_json"
          test "$(jq -c '[.repositories[].full_name] | sort' "$readback_json")" = "[\"$EXPECTED_FULL_NAME\"]"
          jq -n --argjson app "$(cat "$app_json")" --argjson installs "$(cat "$installs_json")" --argjson token_response "$(cat "$token_json")" --argjson readback "$(cat "$readback_json")" --arg owner "$EXPECTED_OWNER" '{contract_version:"PEB3_TOKEN_SCOPE_PROVIDER_EVIDENCE_V3",provider:"GITHUB",app:{id:$app.id,slug:$app.slug,registered_permissions:$app.permissions},installation:($installs|map(select(.account.login==$owner))|.[0]|{id:.id,account:.account.login,repository_selection:.repository_selection,permissions:.permissions}),token:{repository_set:($token_response.repositories|map(.full_name)|sort),permissions:$token_response.permissions,expires_at:$token_response.expires_at,independent_repository_readback:($readback.repositories|map(.full_name)|sort),independent_repository_readback_verified:true,token_value_included:false}}' > peb3-token-scope-evidence-v3.json
          rm -f "$token_json"
      - name: Publish sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: peb3-token-scope-evidence-v3
          path: peb3-token-scope-evidence-v3.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish sanitized evidence to trigger PR
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          jq -n --rawfile evidence peb3-token-scope-evidence-v3.json '{body:("Calibration infrastructure only. This PR is not the formal PEB-3E target.\n\n## PEB-3 token scope V3 evidence\n\n```json\n"+$evidence+"```\n")}' > pr-update.json
          curl --fail-with-body -sS -X PATCH -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --data-binary @pr-update.json >/dev/null
          rm -f pr-update.json
