name: PEB-3 Token Scope Evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/peb3-token-scope-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-token-scope:
    runs-on: ubuntu-latest
    env:
      EXPECTED_OWNER: pie-peb3-lab
      EXPECTED_REPOSITORY: pie-peb3-calibration
      EXPECTED_FULL_NAME: pie-peb3-lab/pie-peb3-calibration
      PEB3_APP_ID: ${{ vars.PEB3_APP_ID }}
      PEB3_APP_PRIVATE_KEY: ${{ secrets.PEB3_APP_PRIVATE_KEY }}
    steps:
      - name: Validate configured inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PEB3_APP_ID"
          test -n "$PEB3_APP_PRIVATE_KEY"

      - name: Mint downscoped installation token and sanitize provider response
        shell: bash
        run: |
          set -euo pipefail

          key_file="$(mktemp)"
          app_json="$(mktemp)"
          installations_json="$(mktemp)"
          token_response="$(mktemp)"
          token_request="$(mktemp)"
          trap 'rm -f "$key_file" "$app_json" "$installations_json" "$token_response" "$token_request"' EXIT

          printf '%s' "$PEB3_APP_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          b64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          now="$(date +%s)"
          iat="$((now - 60))"
          exp="$((now + 540))"
          header='{"alg":"RS256","typ":"JWT"}'
          payload="$(printf '{\"iat\":%s,\"exp\":%s,\"iss\":\"%s\"}' "$iat" "$exp" "$PEB3_APP_ID")"
          unsigned="$(printf '%s' "$header" | b64url).$(printf '%s' "$payload" | b64url)"
          signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key_file" | b64url)"
          app_jwt="$unsigned.$signature"
          echo "::add-mask::$app_jwt"

          curl --fail-with-body -sS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $app_jwt" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/app > "$app_json"

          curl --fail-with-body -sS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $app_jwt" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/app/installations > "$installations_json"

          installation_id="$(python - "$installations_json" "$EXPECTED_OWNER" <<'PY'
import json, sys
path, owner = sys.argv[1], sys.argv[2]
data = json.load(open(path, encoding='utf-8'))
matches = [x for x in data if (x.get('account') or {}).get('login') == owner]
if len(matches) != 1:
    raise SystemExit(f'expected exactly one installation for {owner}, got {len(matches)}')
item = matches[0]
if item.get('repository_selection') != 'selected':
    raise SystemExit(f"repository_selection must be selected, got {item.get('repository_selection')!r}")
print(item['id'])
PY
          )"

          printf '{"repositories":["%s"],"permissions":{"pull_requests":"write"}}' "$EXPECTED_REPOSITORY" > "$token_request"

          curl --fail-with-body -sS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $app_jwt" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/app/installations/$installation_id/access_tokens" \
            --data-binary "@$token_request" > "$token_response"

          python - "$app_json" "$installations_json" "$token_response" "$EXPECTED_OWNER" "$EXPECTED_FULL_NAME" "$GITHUB_ENV" <<'PY'
import json, os, sys
app_path, installations_path, token_path, owner, full_name, env_path = sys.argv[1:]
app = json.load(open(app_path, encoding='utf-8'))
installations = json.load(open(installations_path, encoding='utf-8'))
response = json.load(open(token_path, encoding='utf-8'))

token = response.get('token')
if not token:
    raise SystemExit('provider token response did not contain token')
print(f'::add-mask::{token}')
with open(env_path, 'a', encoding='utf-8') as fh:
    fh.write(f'PEB3_INSTALLATION_TOKEN={token}\n')

matches = [x for x in installations if (x.get('account') or {}).get('login') == owner]
if len(matches) != 1:
    raise SystemExit('installation identity is not unique')
installation = matches[0]
repo_names = sorted((r.get('full_name') or '') for r in response.get('repositories', []))
permissions = response.get('permissions') or {}
expires_at = response.get('expires_at')

if repo_names != [full_name]:
    raise SystemExit(f'unexpected token repository set: {repo_names}')
if permissions.get('pull_requests') != 'write':
    raise SystemExit(f"pull_requests permission must be write: {permissions}")
if set(permissions) - {'pull_requests', 'metadata'}:
    raise SystemExit(f'unexpected extra token permissions: {permissions}')
if permissions.get('metadata') not in (None, 'read'):
    raise SystemExit(f"metadata permission must be read/implicit: {permissions}")
if not expires_at:
    raise SystemExit('expires_at missing from provider token response')

sanitized = {
    'contract_version': 'PEB3_TOKEN_SCOPE_PROVIDER_EVIDENCE_V1',
    'provider': 'GITHUB',
    'app': {
        'id': app.get('id'),
        'slug': app.get('slug'),
        'owner': (app.get('owner') or {}).get('login'),
        'registered_permissions': app.get('permissions') or {},
    },
    'installation': {
        'id': installation.get('id'),
        'account': (installation.get('account') or {}).get('login'),
        'repository_selection': installation.get('repository_selection'),
        'permissions': installation.get('permissions') or {},
    },
    'token': {
        'repository_set': repo_names,
        'permissions': permissions,
        'expires_at': expires_at,
        'token_value_included': False,
    },
}
with open('peb3-token-scope-evidence.json', 'w', encoding='utf-8') as fh:
    json.dump(sanitized, fh, indent=2, sort_keys=True)
    fh.write('\n')
PY

          rm -f "$token_response"

      - name: Independently read back token repository set
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $PEB3_INSTALLATION_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/installation/repositories > token-repositories-readback.json

          python - "$EXPECTED_FULL_NAME" <<'PY'
import json, sys
expected = sys.argv[1]
data = json.load(open('token-repositories-readback.json', encoding='utf-8'))
repos = sorted((r.get('full_name') or '') for r in data.get('repositories', []))
if repos != [expected]:
    raise SystemExit(f'independent token readback mismatch: {repos}')

evidence = json.load(open('peb3-token-scope-evidence.json', encoding='utf-8'))
evidence['token']['independent_repository_readback'] = repos
evidence['token']['independent_repository_readback_verified'] = True
with open('peb3-token-scope-evidence.json', 'w', encoding='utf-8') as fh:
    json.dump(evidence, fh, indent=2, sort_keys=True)
    fh.write('\n')
PY
          rm -f token-repositories-readback.json

      - name: Publish sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: peb3-token-scope-evidence
          path: peb3-token-scope-evidence.json
          if-no-files-found: error
          retention-days: 7
