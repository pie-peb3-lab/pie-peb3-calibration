name: PEB-3 Token Scope Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - .pie-calibration/token-scope-trigger.txt
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  prove-token-scope:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'gycha0109-beep')
    runs-on: ubuntu-latest
    env:
      EXPECTED_OWNER: pie-peb3-lab
      EXPECTED_REPOSITORY: pie-peb3-calibration
      EXPECTED_FULL_NAME: pie-peb3-lab/pie-peb3-calibration
      PEB3_APP_ID: ${{ vars.PEB3_APP_ID }}
      PEB3_APP_PRIVATE_KEY: ${{ secrets.PEB3_APP_PRIVATE_KEY }}

    steps:
      - name: Probe provider token scope
        id: probe
        shell: bash
        run: |
          set -u

          rm -f peb3-token-scope-evidence.json peb3-token-scope-diagnostic.json
          key_file="$(mktemp)"
          app_json="$(mktemp)"
          installations_json="$(mktemp)"
          token_response="$(mktemp)"
          token_request="$(mktemp)"
          readback_json="$(mktemp)"
          trap 'rm -f "$key_file" "$app_json" "$installations_json" "$token_response" "$token_request" "$readback_json"' EXIT

          diagnostic() {
            local reason="$1"
            local http_status="${2:-}"
            jq -n \
              --arg reason "$reason" \
              --arg http_status "$http_status" \
              --argjson app_id_configured "$([ -n "${PEB3_APP_ID:-}" ] && echo true || echo false)" \
              --argjson private_key_secret_configured "$([ -n "${PEB3_APP_PRIVATE_KEY:-}" ] && echo true || echo false)" \
              '{
                contract_version:"PEB3_TOKEN_SCOPE_DIAGNOSTIC_V2",
                status:"BLOCKED",
                reason:$reason,
                http_status:(if $http_status == "" then null else $http_status end),
                app_id_configured:$app_id_configured,
                private_key_secret_configured:$private_key_secret_configured,
                credential_values_included:false
              }' > peb3-token-scope-diagnostic.json
            echo "probe_status=blocked" >> "$GITHUB_OUTPUT"
          }

          if [ -z "${PEB3_APP_ID:-}" ]; then
            diagnostic "APP_ID_VARIABLE_MISSING"
            exit 0
          fi

          if [ -z "${PEB3_APP_PRIVATE_KEY:-}" ]; then
            diagnostic "PRIVATE_KEY_SECRET_MISSING"
            exit 0
          fi

          printf '%s' "$PEB3_APP_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          if ! openssl pkey -in "$key_file" -noout >/dev/null 2>&1; then
            diagnostic "PRIVATE_KEY_PARSE_FAILED"
            exit 0
          fi

          b64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          now="$(date +%s)"
          iat="$((now - 60))"
          exp="$((now + 540))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(jq -nc --argjson iat "$iat" --argjson exp "$exp" --arg iss "$PEB3_APP_ID" '{iat:$iat,exp:$exp,iss:$iss}' | b64url)"
          unsigned="$header.$payload"

          if ! signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key_file" | b64url)"; then
            diagnostic "APP_JWT_SIGNING_FAILED"
            exit 0
          fi
          app_jwt="$unsigned.$signature"
          echo "::add-mask::$app_jwt"

          app_status="$(curl -sS -o "$app_json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $app_jwt" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/app || true)"
          if [ "$app_status" != "200" ]; then
            diagnostic "APP_JWT_AUTH_FAILED" "$app_status"
            exit 0
          fi

          installations_status="$(curl -sS -o "$installations_json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $app_jwt" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/app/installations || true)"
          if [ "$installations_status" != "200" ]; then
            diagnostic "INSTALLATION_LIST_FAILED" "$installations_status"
            exit 0
          fi

          installation_count="$(jq --arg owner "$EXPECTED_OWNER" '[.[] | select(.account.login == $owner)] | length' "$installations_json")"
          if [ "$installation_count" != "1" ]; then
            diagnostic "INSTALLATION_IDENTITY_NOT_UNIQUE"
            exit 0
          fi

          installation_id="$(jq -r --arg owner "$EXPECTED_OWNER" '.[] | select(.account.login == $owner) | .id' "$installations_json")"
          repository_selection="$(jq -r --arg owner "$EXPECTED_OWNER" '.[] | select(.account.login == $owner) | .repository_selection' "$installations_json")"
          if [ "$repository_selection" != "selected" ]; then
            diagnostic "INSTALLATION_REPOSITORY_SELECTION_NOT_SELECTED"
            exit 0
          fi

          jq -nc \
            --arg repo "$EXPECTED_REPOSITORY" \
            '{repositories:[$repo],permissions:{pull_requests:"write"}}' > "$token_request"

          token_status="$(curl -sS -o "$token_response" -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $app_jwt" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/app/installations/$installation_id/access_tokens" \
            --data-binary "@$token_request" || true)"
          if [ "$token_status" != "201" ]; then
            diagnostic "TOKEN_MINT_FAILED" "$token_status"
            exit 0
          fi

          token="$(jq -r '.token // empty' "$token_response")"
          if [ -z "$token" ]; then
            diagnostic "TOKEN_VALUE_MISSING_FROM_PROVIDER_RESPONSE"
            exit 0
          fi
          echo "::add-mask::$token"

          repo_set="$(jq -c '[.repositories[].full_name] | sort' "$token_response")"
          if [ "$repo_set" != "[\"$EXPECTED_FULL_NAME\"]" ]; then
            diagnostic "TOKEN_REPOSITORY_SCOPE_MISMATCH"
            exit 0
          fi

          pr_permission="$(jq -r '.permissions.pull_requests // empty' "$token_response")"
          if [ "$pr_permission" != "write" ]; then
            diagnostic "TOKEN_PULL_REQUEST_PERMISSION_NOT_WRITE"
            exit 0
          fi

          extra_permissions="$(jq -c '[.permissions | to_entries[] | select(.key != "pull_requests" and .key != "metadata")]' "$token_response")"
          if [ "$extra_permissions" != "[]" ]; then
            diagnostic "TOKEN_EXTRA_PERMISSIONS_PRESENT"
            exit 0
          fi

          metadata_permission="$(jq -r '.permissions.metadata // "read"' "$token_response")"
          if [ "$metadata_permission" != "read" ]; then
            diagnostic "TOKEN_METADATA_PERMISSION_NOT_READ"
            exit 0
          fi

          expires_at="$(jq -r '.expires_at // empty' "$token_response")"
          if [ -z "$expires_at" ]; then
            diagnostic "TOKEN_EXPIRY_MISSING"
            exit 0
          fi

          readback_status="$(curl -sS -o "$readback_json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $token" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/installation/repositories || true)"
          if [ "$readback_status" != "200" ]; then
            diagnostic "TOKEN_REPOSITORY_READBACK_FAILED" "$readback_status"
            exit 0
          fi

          independent_repo_set="$(jq -c '[.repositories[].full_name] | sort' "$readback_json")"
          if [ "$independent_repo_set" != "[\"$EXPECTED_FULL_NAME\"]" ]; then
            diagnostic "INDEPENDENT_REPOSITORY_READBACK_MISMATCH"
            exit 0
          fi

          jq -n \
            --argjson app "$(cat "$app_json")" \
            --argjson installations "$(cat "$installations_json")" \
            --argjson response "$(cat "$token_response")" \
            --argjson readback "$(cat "$readback_json")" \
            --arg owner "$EXPECTED_OWNER" \
            --arg full_name "$EXPECTED_FULL_NAME" \
            '{
              contract_version:"PEB3_TOKEN_SCOPE_PROVIDER_EVIDENCE_V2",
              provider:"GITHUB",
              app:{
                id:$app.id,
                slug:$app.slug,
                owner:$app.owner.login,
                registered_permissions:$app.permissions
              },
              installation:(
                $installations
                | map(select(.account.login == $owner))
                | .[0]
                | {
                    id:.id,
                    account:.account.login,
                    repository_selection:.repository_selection,
                    permissions:.permissions
                  }
              ),
              token:{
                repository_set:($response.repositories | map(.full_name) | sort),
                permissions:$response.permissions,
                expires_at:$response.expires_at,
                independent_repository_readback:($readback.repositories | map(.full_name) | sort),
                independent_repository_readback_verified:(($readback.repositories | map(.full_name) | sort) == [$full_name]),
                token_value_included:false
              }
            }' > peb3-token-scope-evidence.json

          rm -f "$token_response"
          echo "probe_status=pass" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized evidence artifact
        if: steps.probe.outputs.probe_status == 'pass'
        uses: actions/upload-artifact@v4
        with:
          name: peb3-token-scope-evidence
          path: peb3-token-scope-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish sanitized result to trigger PR
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -f peb3-token-scope-evidence.json ]; then
            result_file="peb3-token-scope-evidence.json"
            heading="Sanitized provider evidence"
          elif [ -f peb3-token-scope-diagnostic.json ]; then
            result_file="peb3-token-scope-diagnostic.json"
            heading="Sanitized diagnostic"
          else
            jq -n '{
              contract_version:"PEB3_TOKEN_SCOPE_DIAGNOSTIC_V2",
              status:"BLOCKED",
              reason:"PROBE_TERMINATED_WITHOUT_RESULT_FILE",
              credential_values_included:false
            }' > peb3-token-scope-diagnostic.json
            result_file="peb3-token-scope-diagnostic.json"
            heading="Sanitized diagnostic"
          fi

          {
            echo "Calibration infrastructure only. This PR exists solely to trigger the token-scope evidence workflow."
            echo "It is not the formal PEB-3E target."
            echo
            echo "## $heading"
            echo
            echo '```json'
            cat "$result_file"
            echo '```'
          } > pr-body.md

          jq -n --rawfile body pr-body.md '{body:$body}' > pr-update.json
          patch_status="$(curl -sS -o pr-update-response.json -w '%{http_code}' -X PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --data-binary @pr-update.json || true)"
          if [ "$patch_status" != "200" ]; then
            echo "::error::Failed to publish sanitized result to PR; HTTP $patch_status"
            exit 1
          fi
          rm -f pr-update.json pr-update-response.json pr-body.md

      - name: Enforce provider proof success
        if: always()
        shell: bash
        run: |
          test "${{ steps.probe.outputs.probe_status }}" = "pass"
